[project]
authors = [
  {name = "George De Ath", email = "g.de.ath@exeter.ac.uk"},
]
dependencies = [
  "matplotlib>=3.10.9",
  "numba>=0.65.1",
  "numpy>=2.4.4",
  "scipy>=1.17.1",
]
description = "Geometric reachability-based safety filtering for air traffic control"
license = "MIT"
name = "geometric_safety"
requires-python = ">=3.13,<3.14"
version = "0.3.4"

[project.urls]
Repository = "https://github.com/project-bluebird/geometric_safety"

[dependency-groups]
apps = ["fastapi[all]>=0.136.1"]
browser = ["playwright>=1.64.0"]
dev = [
  "httpx>=0.28.1",
  "jupyter>=1.1.1",
  "mpmath>=1.4.1",
  "pytest>=9.0.3",
  "ruff>=0.15.12",
  "ty>=0.0.32",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[tool.setuptools.packages.find]
include = ["geometric_safety*"]
namespaces = false
where = ["."]

[tool.setuptools.package-data]
geometric_safety = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
exclude = [".venv/", ".git/"]
extend-include = ["*.ipynb"]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
ignore = [
  "ANN401",
  "B905",
  "PTH123",
]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "PD",
  "W",
  "ANN",
  "ASYNC",
  "A",
  "C4",
  "ISC",
  "ICN",
  "PT",
  "RET",
  "ARG",
  "R",
  "PERF",
  "RUF",
  "PIE",
  "FURB",
  "PTH",
]

[tool.ruff.lint.per-file-ignores]
"paper/tests/**" = ["ARG", "RUF059"]
"tests/**" = ["ARG", "RUF059"]

[tool.ruff.lint.isort]
case-sensitive = false
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
